<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search for Pokémon and explore their basic stats.">
    <title>Pokédex | Pokémon Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="app-shell">
        <section class="hero" aria-labelledby="page-title">
            <div class="eyebrow"><span class="eyebrow-dot"></span> Pokédex explorer</div>
            <h1 id="page-title">Meet your next<br><span>favourite Pokémon.</span></h1>
            <p class="hero-copy">Search the Pokédex to discover a Pokémon's essential stats and official artwork.</p>

            <form class="search-form" id="searchForm">
                <label for="pokemonName">Search by name</label>
                <div class="search-row">
                    <input type="search" id="pokemonName" placeholder="Try Pikachu" value="pikachu" autocomplete="off" required>
                    <button type="submit" id="fetchButton">
                        <span>Search</span>
                        <span class="button-arrow" aria-hidden="true">→</span>
                    </button>
                </div>
            </form>
        </section>

        <section class="result-card" aria-live="polite">
            <div class="card-accent"></div>
            <div class="pokemon-art">
                <div class="art-glow"></div>
                <img src="" alt="" id="pokemonSprite">
            </div>
            <div class="pokemon-details">
                <p class="result-label">Pokémon profile</p>
                <div id="pokemonInfo">
                    <p class="empty-state">Your discovery will appear here.</p>
                </div>
                <p class="status-message" id="statusMessage" role="status"></p>
            </div>
        </section>

        <footer>Powered by <a href="https://pokeapi.co/" target="_blank" rel="noreferrer">PokéAPI</a></footer>
    </main>

    <script src="fetchdata.js"></script>
</body>
</html>
